  <h1 class="m-n font-thin h3">Data Pasien</h1>
</div>
<div class="wrapper-md">
 <div class="panel panel-default">
    <div class="panel-heading font-bold">
      Input Data Pasien
    </div>
    <div class="panel-body">
      <form class="form-horizontal" method="get">
        <div class="form-group">
          <label class="col-sm-2 control-label" for="input-id-1">Nomor Pasien</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="input-id-1">
          </div>
        </div>
        <div class="line line-dashed b-b line-lg pull-in"></div>
		<div class="form-group">
          <label class="col-sm-2 control-label" for="input-id-1">Nama Pasien</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="input-id-1">
          </div>
        </div>
        <div class="line line-dashed b-b line-lg pull-in"></div>
        <div class="form-group">
          <label class="col-sm-2 control-label" for="input-id-1">Nomor KTP</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="input-id-1">
          </div>
        </div>
        <div class="line line-dashed b-b line-lg pull-in"></div>	
		<div class="form-group">
          <label class="col-sm-2 control-label">Golongan Darah</label>
          <div class="col-sm-10">
            <select name="account" class="form-control m-b">
              <option>A</option>
              <option>B</option>
              <option>AB</option>
              <option>O</option>
            </select>          
          </div>
        </div>
        <div class="line line-dashed b-b line-lg pull-in"></div>
		<div class="form-group">
          <label class="col-sm-2 control-label">Jenis Kelamin</label>
          <div class="col-sm-10">
            <select name="account" class="form-control m-b">
              <option>Pria</option>
              <option>Wanita</option>
            </select>          
          </div>
        </div>
        <div class="line line-dashed b-b line-lg pull-in"></div>
		<div class="form-group">
          <label class="col-sm-2 control-label" for="input-id-1">Tempat Lahir</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="input-id-1">
          </div>
        </div>
        <div class="line line-dashed b-b line-lg pull-in"></div>
		<div class="form-group">
          <label class="col-sm-2 control-label">Tanggal Lahir</label>
          <div class="col-sm-10" ng-controller="DatepickerDemoCtrl">
            <div class="input-group w-md">
              <input type="text" class="form-control" datepicker-popup="" ng-model="dt" is-open="opened" datepicker-options="dateOptions" ng-required="true" close-text="Close" />
              <span class="input-group-btn">
                <button type="button" class="btn btn-default" ng-click="open($event)"><i class="glyphicon glyphicon-calendar"></i></button>
              </span>
            </div>
          </div>
        </div>

        <div class="line line-dashed b-b line-lg pull-in"></div>
		<div class="form-group">
          <label class="col-sm-2 control-label" for="input-id-1">Alamat</label>
          <div class="col-sm-10">
            <textarea type="text" class="form-control" id="input-id-1"></textarea>
          </div>
        </div>
        <div class="line line-dashed b-b line-lg pull-in"></div>
		<div class="form-group">
          <label class="col-sm-2 control-label" for="input-id-1">No Kontak</label>
          <div class="col-sm-10">
            <Input type="text" class="form-control" id="input-id-1">
          </div>
        </div>
        <div class="line line-dashed b-b line-lg pull-in"></div>
		<div class="form-group">
          <label class="col-sm-2 control-label" for="input-id-1">Pekerjaan</label>
          <div class="col-sm-10">
            <Input type="text" class="form-control" id="input-id-1">
          </div>
        </div>
        <div class="line line-dashed b-b line-lg pull-in"></div>
		<div class="form-group">
          <label class="col-sm-2 control-label" for="input-id-1">Riwayat Penyakit</label>
          <div class="col-sm-10">
            <Input type="text" class="form-control" id="input-id-1">
          </div>
        </div>
        <div class="line line-dashed b-b line-lg pull-in"></div>
		<div class="form-group">
          <label class="col-sm-2 control-label" for="input-id-1">Alergi</label>
          <div class="col-sm-10">
            <Input type="text" class="form-control" id="input-id-1">
          </div>
        </div>
        <div class="line line-dashed b-b line-lg pull-in"></div>
          <div class="col-sm-4 col-sm-offset-2">
            <button type="submit" class="btn btn-default">Cancel</button>
            <button type="submit" class="btn btn-primary">Simpan data</button>
          </div>
        </div>
      </form>
